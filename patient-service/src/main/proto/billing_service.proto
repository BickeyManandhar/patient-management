syntax = "proto3";

option java_multiple_files = true;
option java_package = "billing";

//defining service, we use this for endpoint
service BillingService {
  //defining method and its input and output
  rpc CreateBillingAccount(BillingRequest) returns (BillingResponse);
}

//this is like a DTO
message BillingRequest{
  string patientId = 1; //help with serialization or deserialization
  string name = 2;
  string email = 3;
}

message BillingResponse{
  string accountId = 1;
  string status = 2;
}
